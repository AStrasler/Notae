<svg style="background:#F3E9D2" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A circular study nota on joints: rings of joint facts with four corner roundels on joint classes, the knee, shoulder and hip"><defs><style>@import url("https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;family=EB+Garamond:ital,wght@0,400;1,400&amp;display=swap");</style><path id="jr0" d="M 500 410.45 A 89.55 89.55 0 1 1 500 589.55 A 89.55 89.55 0 1 1 500 410.45" fill="none"></path><path id="jr1" d="M 500 375.45 A 124.55 124.55 0 1 1 500 624.55 A 124.55 124.55 0 1 1 500 375.45" fill="none"></path><path id="jr2" d="M 500 340.45 A 159.55 159.55 0 1 1 500 659.55 A 159.55 159.55 0 1 1 500 340.45" fill="none"></path><path id="jr3" d="M 500 305.45 A 194.55 194.55 0 1 1 500 694.55 A 194.55 194.55 0 1 1 500 305.45" fill="none"></path><path id="jr4" d="M 500 270.45 A 229.55 229.55 0 1 1 500 729.55 A 229.55 229.55 0 1 1 500 270.45" fill="none"></path><path id="jr5" d="M 500 235.45 A 264.55 264.55 0 1 1 500 764.55 A 264.55 264.55 0 1 1 500 235.45" fill="none"></path><path id="jr6" d="M 500 200.45 A 299.55 299.55 0 1 1 500 799.55 A 299.55 299.55 0 1 1 500 200.45" fill="none"></path><path id="jr7" d="M 500 165.45 A 334.55 334.55 0 1 1 500 834.55 A 334.55 334.55 0 1 1 500 165.45" fill="none"></path><path id="jc0" d="M 138 44 A 94 94 0 1 1 138 232 A 94 94 0 1 1 138 44" fill="none"></path><path id="jc1" d="M 862 44 A 94 94 0 1 1 862 232 A 94 94 0 1 1 862 44" fill="none"></path><path id="jc2" d="M 138 768 A 94 94 0 1 1 138 956 A 94 94 0 1 1 138 768" fill="none"></path><path id="jc3" d="M 862 768 A 94 94 0 1 1 862 956 A 94 94 0 1 1 862 768" fill="none"></path></defs><rect x="0" y="0" width="1000" height="1000" fill="#F3E9D2"></rect><rect x="12" y="12" width="976" height="976" fill="none" stroke="#A8812A" stroke-width="2"></rect><rect x="20" y="20" width="960" height="960" fill="none" stroke="#9E2B1A" stroke-width="0.8"></rect><line x1="237.0" y1="237.0" x2="218.6" y2="218.6" stroke="#9E2B1A" stroke-width="2.2"></line><line x1="237.0" y1="237.0" x2="218.6" y2="218.6" stroke="#F3E9D2" stroke-width="0.8"></line><line x1="763.0" y1="237.0" x2="781.4" y2="218.6" stroke="#9E2B1A" stroke-width="2.2"></line><line x1="763.0" y1="237.0" x2="781.4" y2="218.6" stroke="#F3E9D2" stroke-width="0.8"></line><line x1="237.0" y1="763.0" x2="218.6" y2="781.4" stroke="#9E2B1A" stroke-width="2.2"></line><line x1="237.0" y1="763.0" x2="218.6" y2="781.4" stroke="#F3E9D2" stroke-width="0.8"></line><line x1="763.0" y1="763.0" x2="781.4" y2="781.4" stroke="#9E2B1A" stroke-width="2.2"></line><line x1="763.0" y1="763.0" x2="781.4" y2="781.4" stroke="#F3E9D2" stroke-width="0.8"></line><circle cx="500" cy="500" r="372" fill="#F3E9D2" stroke="#A8812A" stroke-width="3"></circle><circle cx="500" cy="500" r="366" fill="none" stroke="#9E2B1A" stroke-width="1.2"></circle><circle cx="500" cy="500" r="358" fill="#F3E9D2" stroke="#2B2118" stroke-width="0.9"></circle><circle cx="500" cy="500" r="323" fill="#EADBB8" stroke="#2B2118" stroke-width="0.9"></circle><circle cx="500" cy="500" r="288" fill="#F3E9D2" stroke="#2B2118" stroke-width="0.9"></circle><circle cx="500" cy="500" r="253" fill="#EADBB8" stroke="#2B2118" stroke-width="0.9"></circle><circle cx="500" cy="500" r="218" fill="#F3E9D2" stroke="#2B2118" stroke-width="0.9"></circle><circle cx="500" cy="500" r="183" fill="#EADBB8" stroke="#2B2118" stroke-width="0.9"></circle><circle cx="500" cy="500" r="148" fill="#F3E9D2" stroke="#2B2118" stroke-width="0.9"></circle><circle cx="500" cy="500" r="113" fill="#EADBB8" stroke="#2B2118" stroke-width="0.9"></circle><text font-family="EB Garamond, Georgia, serif" font-size="12.16" fill="#2B2118"><textPath href="#jr0" startOffset="9.8" textLength="543.0" lengthAdjust="spacing"><tspan fill="#9E2B1A" font-family="Cinzel, serif" font-weight="600">CLASSES ✠ </tspan><tspan>Structural: what binds it, is there a cavity? · Functional: how much does it move? · </tspan></textPath></text><text font-family="EB Garamond, Georgia, serif" font-size="15.00" fill="#2B2118"><textPath href="#jr1" startOffset="13.7" textLength="755.2" lengthAdjust="spacing"><tspan fill="#9E2B1A" font-family="Cinzel, serif" font-weight="600">AXES ✠ </tspan><tspan>Nonaxial slips · Uniaxial moves in one plane · Biaxial in two · Multiaxial in all three · </tspan></textPath></text><text font-family="EB Garamond, Georgia, serif" font-size="15.00" fill="#2B2118"><textPath href="#jr2" startOffset="17.5" textLength="967.4" lengthAdjust="spacing"><tspan fill="#9E2B1A" font-family="Cinzel, serif" font-weight="600">SIX SHAPES ✠ </tspan><tspan>Plane glides · Hinge flexes · Pivot rotates · Condylar and saddle move on two axes · Ball-and-socket on all three · </tspan></textPath></text><text font-family="EB Garamond, Georgia, serif" font-size="15.00" fill="#2B2118"><textPath href="#jr3" startOffset="21.4" textLength="1179.6" lengthAdjust="spacing"><tspan fill="#9E2B1A" font-family="Cinzel, serif" font-weight="600">SYNOVIAL PARTS ✠ </tspan><tspan>Hyaline articular cartilage · joint cavity · capsule of fibrous layer + synovial membrane · synovial fluid lubricates, nourishes, cleans · </tspan></textPath></text><text font-family="EB Garamond, Georgia, serif" font-size="15.00" fill="#2B2118"><textPath href="#jr4" startOffset="25.2" textLength="1391.8" lengthAdjust="spacing"><tspan fill="#9E2B1A" font-family="Cinzel, serif" font-weight="600">LIGAMENTS ✠ </tspan><tspan>Capsular: a thickened capsule · Extracapsular: outside it, the collaterals · Intracapsular: inside it, the ACL and PCL · nerves sense pain and position · </tspan></textPath></text><text font-family="EB Garamond, Georgia, serif" font-size="15.00" fill="#2B2118"><textPath href="#jr5" startOffset="29.1" textLength="1604.0" lengthAdjust="spacing"><tspan fill="#9E2B1A" font-family="Cinzel, serif" font-weight="600">ACCESSORY ✠ </tspan><tspan>Bursa: a fluid sac, the ball bearing · Tendon sheath: a bursa wrapped round a tendon · Meniscus: fibrocartilage for fit · Fat pad: cushion · </tspan></textPath></text><text font-family="EB Garamond, Georgia, serif" font-size="15.00" fill="#2B2118"><textPath href="#jr6" startOffset="32.9" textLength="1816.3" lengthAdjust="spacing"><tspan fill="#9E2B1A" font-family="Cinzel, serif" font-weight="600">MOVEMENTS ✠ </tspan><tspan>Flexion closes the angle, extension opens it · Abduction away from the midline, adduction toward · Circumduction draws a cone · Rotation turns on the long axis · </tspan></textPath></text><text font-family="EB Garamond, Georgia, serif" font-size="15.00" fill="#2B2118"><textPath href="#jr7" startOffset="36.8" textLength="2028.5" lengthAdjust="spacing"><tspan fill="#9E2B1A" font-family="Cinzel, serif" font-weight="600">SPECIAL ✠ </tspan><tspan>Supination: palms forward · Pronation: palms back · Dorsiflexion: foot to shin · Plantar flexion: point toes · Inversion: sole in · Eversion: sole out · Protraction, retraction · Elevation, depression · Opposition · </tspan></textPath></text><line x1="500" y1="422" x2="500" y2="142" stroke="#9E2B1A" stroke-width="1.4"></line><circle cx="500" cy="500" r="78" fill="#1F3F7A" stroke="#A8812A" stroke-width="3"></circle><circle cx="500" cy="500" r="71" fill="none" stroke="#A8812A" stroke-width="0.8"></circle><text x="500" y="490" text-anchor="middle" font-family="Cinzel, serif" font-weight="600" font-size="14" fill="#F3E9D2">JOINT</text><text x="500" y="510" text-anchor="middle" font-family="EB Garamond, serif" font-style="italic" font-size="10.5" fill="#F3E9D2">where two or more</text><text x="500" y="524" text-anchor="middle" font-family="EB Garamond, serif" font-style="italic" font-size="10.5" fill="#F3E9D2">bones meet</text><circle cx="138" cy="138" r="112" fill="#EADBB8" stroke="#A8812A" stroke-width="2.5"></circle><circle cx="138" cy="138" r="86" fill="#F3E9D2" stroke="#2B2118" stroke-width="0.9"></circle><text font-family="EB Garamond, Georgia, serif" font-size="13.70" fill="#2B2118"><textPath href="#jc0" startOffset="8.9" textLength="572.9" lengthAdjust="spacing"><tspan fill="#9E2B1A" font-family="Cinzel, serif" font-weight="600">FIBROUS ✠ </tspan><tspan>joined by dense fibrous connective tissue · no joint cavity · most immovable · </tspan></textPath></text><text x="138" y="83" text-anchor="middle" font-family="Cinzel, serif" font-size="11.5" font-weight="600" fill="#1F3F7A">Suture</text><text x="138" y="97" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">skull; fused =</text><text x="138" y="110" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">synostosis</text><text x="138" y="128" text-anchor="middle" font-family="Cinzel, serif" font-size="11.5" font-weight="600" fill="#1F3F7A">Syndesmosis</text><text x="138" y="142" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">tibiofibular;</text><text x="138" y="155" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">interosseous</text><text x="138" y="173" text-anchor="middle" font-family="Cinzel, serif" font-size="11.5" font-weight="600" fill="#1F3F7A">Gomphosis</text><text x="138" y="187" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">tooth; periodontal</text><text x="138" y="200" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">ligament</text><circle cx="862" cy="138" r="112" fill="#EADBB8" stroke="#A8812A" stroke-width="2.5"></circle><circle cx="862" cy="138" r="86" fill="#F3E9D2" stroke="#2B2118" stroke-width="0.9"></circle><text font-family="EB Garamond, Georgia, serif" font-size="14.00" fill="#2B2118"><textPath href="#jc1" startOffset="8.9" textLength="572.9" lengthAdjust="spacing"><tspan fill="#9E2B1A" font-family="Cinzel, serif" font-weight="600">CARTILAGINOUS ✠ </tspan><tspan>bones united by cartilage · no joint cavity · not highly movable · </tspan></textPath></text><text x="862" y="99" text-anchor="middle" font-family="Cinzel, serif" font-size="11.5" font-weight="600" fill="#1F3F7A">Synchondrosis</text><text x="862" y="113" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">HYALINE · epiphyseal</text><text x="862" y="126" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">plate, 1st rib</text><text x="862" y="144" text-anchor="middle" font-family="Cinzel, serif" font-size="11.5" font-weight="600" fill="#1F3F7A">Symphysis</text><text x="862" y="158" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">FIBROCARTILAGE ·</text><text x="862" y="171" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">intervertebral; pubic</text><text x="862" y="184" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">symphysis</text><circle cx="138" cy="862" r="112" fill="#EADBB8" stroke="#A8812A" stroke-width="2.5"></circle><circle cx="138" cy="862" r="86" fill="#F3E9D2" stroke="#2B2118" stroke-width="0.9"></circle><text font-family="EB Garamond, Georgia, serif" font-size="12.44" fill="#2B2118"><textPath href="#jc2" startOffset="8.9" textLength="572.9" lengthAdjust="spacing"><tspan fill="#9E2B1A" font-family="Cinzel, serif" font-weight="600">KNEE ✠ </tspan><tspan>tibial collateral is medial · fibular collateral is lateral · menisci sit on the plateau · </tspan></textPath></text><text x="138" y="807" text-anchor="middle" font-family="Cinzel, serif" font-size="11.5" font-weight="600" fill="#1F3F7A">ACL</text><text x="138" y="821" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">anterior tibial</text><text x="138" y="834" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">attachment</text><text x="138" y="852" text-anchor="middle" font-family="Cinzel, serif" font-size="11.5" font-weight="600" fill="#1F3F7A">PCL</text><text x="138" y="866" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">posterior; crosses the</text><text x="138" y="879" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">ACL</text><text x="138" y="897" text-anchor="middle" font-family="Cinzel, serif" font-size="11.5" font-weight="600" fill="#1F3F7A">Unhappy triad</text><text x="138" y="911" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">ACL, tibial collateral,</text><text x="138" y="924" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">medial meniscus</text><circle cx="862" cy="862" r="112" fill="#EADBB8" stroke="#A8812A" stroke-width="2.5"></circle><circle cx="862" cy="862" r="86" fill="#F3E9D2" stroke="#2B2118" stroke-width="0.9"></circle><text font-family="EB Garamond, Georgia, serif" font-size="14.00" fill="#2B2118"><textPath href="#jc3" startOffset="8.9" textLength="572.9" lengthAdjust="spacing"><tspan fill="#9E2B1A" font-family="Cinzel, serif" font-weight="600">SHOULDER &amp; HIP ✠ </tspan><tspan>both ball-and-socket · muscle tone is the chief stabilizer · </tspan></textPath></text><text x="862" y="830" text-anchor="middle" font-family="Cinzel, serif" font-size="11.5" font-weight="600" fill="#1F3F7A">Shoulder</text><text x="862" y="844" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">coracoacromial arch</text><text x="862" y="862" text-anchor="middle" font-family="Cinzel, serif" font-size="11.5" font-weight="600" fill="#1F3F7A">Hip</text><text x="862" y="876" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">acetabular labrum;</text><text x="862" y="888" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">ilio-, pubo-,</text><text x="862" y="902" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">ischiofemoral</text><rect x="262" y="22" width="476" height="48" fill="#EADBB8" stroke="#A8812A" stroke-width="2"></rect><text x="500" y="40" text-anchor="middle" font-family="Cinzel, serif" font-size="12" font-weight="600" fill="#9E2B1A">✠ HOW JOINTS MOVE ✠</text><text x="500" y="59" text-anchor="middle" font-family="EB Garamond, serif" font-size="13" fill="#2B2118">Synarthrosis immovable · Amphiarthrosis slight · Diarthrosis free</text><rect x="262" y="930" width="476" height="48" fill="#EADBB8" stroke="#A8812A" stroke-width="2"></rect><text x="500" y="948" text-anchor="middle" font-family="Cinzel, serif" font-size="12" font-weight="600" fill="#9E2B1A">✠ JOINT INJURIES ✠</text><text x="500" y="967" text-anchor="middle" font-family="EB Garamond, serif" font-size="13" fill="#2B2118">Sprain: ligament · Cartilage tear: rarely heals · Dislocation (partial = subluxation)</text></svg>