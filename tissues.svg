<?xml version="1.0" encoding="UTF-8"?>
<svg style="background:#F3E9D2" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A circular study nota on cells and tissues: rings on the cell, the cell cycle, organelles, epithelium, glands and connective tissue, with corners on epithelia, cartilage, muscle and slide identification"><defs><style>@import url("https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;family=EB+Garamond:ital,wght@0,400;1,400&amp;display=swap");</style><path id="tr0" d="M 500 410.45 A 89.55 89.55 0 1 1 500 589.55 A 89.55 89.55 0 1 1 500 410.45" fill="none"></path><path id="tr1" d="M 500 375.45 A 124.55 124.55 0 1 1 500 624.55 A 124.55 124.55 0 1 1 500 375.45" fill="none"></path><path id="tr2" d="M 500 340.45 A 159.55 159.55 0 1 1 500 659.55 A 159.55 159.55 0 1 1 500 340.45" fill="none"></path><path id="tr3" d="M 500 305.45 A 194.55 194.55 0 1 1 500 694.55 A 194.55 194.55 0 1 1 500 305.45" fill="none"></path><path id="tr4" d="M 500 270.45 A 229.55 229.55 0 1 1 500 729.55 A 229.55 229.55 0 1 1 500 270.45" fill="none"></path><path id="tr5" d="M 500 235.45 A 264.55 264.55 0 1 1 500 764.55 A 264.55 264.55 0 1 1 500 235.45" fill="none"></path><path id="tr6" d="M 500 200.45 A 299.55 299.55 0 1 1 500 799.55 A 299.55 299.55 0 1 1 500 200.45" fill="none"></path><path id="tr7" d="M 500 165.45 A 334.55 334.55 0 1 1 500 834.55 A 334.55 334.55 0 1 1 500 165.45" fill="none"></path><path id="tc0" d="M 138 44 A 94 94 0 1 1 138 232 A 94 94 0 1 1 138 44" fill="none"></path><path id="tc1" d="M 862 44 A 94 94 0 1 1 862 232 A 94 94 0 1 1 862 44" fill="none"></path><path id="tc2" d="M 138 768 A 94 94 0 1 1 138 956 A 94 94 0 1 1 138 768" fill="none"></path><path id="tc3" d="M 862 768 A 94 94 0 1 1 862 956 A 94 94 0 1 1 862 768" fill="none"></path></defs><rect x="0" y="0" width="1000" height="1000" fill="#F3E9D2"></rect><rect x="12" y="12" width="976" height="976" fill="none" stroke="#A8812A" stroke-width="2"></rect><rect x="20" y="20" width="960" height="960" fill="none" stroke="#9E2B1A" stroke-width="0.8"></rect><line x1="237.0" y1="237.0" x2="218.6" y2="218.6" stroke="#9E2B1A" stroke-width="2.2"></line><line x1="237.0" y1="237.0" x2="218.6" y2="218.6" stroke="#F3E9D2" stroke-width="0.8"></line><line x1="763.0" y1="237.0" x2="781.4" y2="218.6" stroke="#9E2B1A" stroke-width="2.2"></line><line x1="763.0" y1="237.0" x2="781.4" y2="218.6" stroke="#F3E9D2" stroke-width="0.8"></line><line x1="237.0" y1="763.0" x2="218.6" y2="781.4" stroke="#9E2B1A" stroke-width="2.2"></line><line x1="237.0" y1="763.0" x2="218.6" y2="781.4" stroke="#F3E9D2" stroke-width="0.8"></line><line x1="763.0" y1="763.0" x2="781.4" y2="781.4" stroke="#9E2B1A" stroke-width="2.2"></line><line x1="763.0" y1="763.0" x2="781.4" y2="781.4" stroke="#F3E9D2" stroke-width="0.8"></line><circle cx="500" cy="500" r="372" fill="#F3E9D2" stroke="#A8812A" stroke-width="3"></circle><circle cx="500" cy="500" r="366" fill="none" stroke="#9E2B1A" stroke-width="1.2"></circle><circle cx="500" cy="500" r="358" fill="#F3E9D2" stroke="#2B2118" stroke-width="0.9"></circle><circle cx="500" cy="500" r="323" fill="#EADBB8" stroke="#2B2118" stroke-width="0.9"></circle><circle cx="500" cy="500" r="288" fill="#F3E9D2" stroke="#2B2118" stroke-width="0.9"></circle><circle cx="500" cy="500" r="253" fill="#EADBB8" stroke="#2B2118" stroke-width="0.9"></circle><circle cx="500" cy="500" r="218" fill="#F3E9D2" stroke="#2B2118" stroke-width="0.9"></circle><circle cx="500" cy="500" r="183" fill="#EADBB8" stroke="#2B2118" stroke-width="0.9"></circle><circle cx="500" cy="500" r="148" fill="#F3E9D2" stroke="#2B2118" stroke-width="0.9"></circle><circle cx="500" cy="500" r="113" fill="#EADBB8" stroke="#2B2118" stroke-width="0.9"></circle><text font-family="EB Garamond, Georgia, serif" font-size="11.00" fill="#2B2118"><textPath href="#tr0" startOffset="9.8" textLength="543.0" lengthAdjust="spacing"><tspan fill="#9E2B1A" font-family="Cinzel, serif" font-weight="600">FOUR TISSUES ✠ </tspan><tspan>Epithelial covers · Connective supports, most abundant · Muscle moves · Nervous signals · </tspan></textPath></text><text font-family="EB Garamond, Georgia, serif" font-size="13.50" fill="#2B2118"><textPath href="#tr1" startOffset="13.7" textLength="755.2" lengthAdjust="spacing"><tspan fill="#9E2B1A" font-family="Cinzel, serif" font-weight="600">THE CELL ✠ </tspan><tspan>Plasma membrane · Cytoplasm · DNA · Chromatin is loose, chromosomes are condensed · Viruses are not cells · </tspan></textPath></text><text font-family="EB Garamond, Georgia, serif" font-size="12.86" fill="#2B2118"><textPath href="#tr2" startOffset="17.5" textLength="967.4" lengthAdjust="spacing"><tspan fill="#9E2B1A" font-family="Cinzel, serif" font-weight="600">CELL CYCLE ✠ </tspan><tspan>Interphase: G₁ grows → S copies DNA → G₂ prepares · Mitosis: Prophase → Metaphase lines up → Anaphase pulls apart → Telophase · then cytokinesis · </tspan></textPath></text><text font-family="EB Garamond, Georgia, serif" font-size="14.26" fill="#2B2118"><textPath href="#tr3" startOffset="21.4" textLength="1179.6" lengthAdjust="spacing"><tspan fill="#9E2B1A" font-family="Cinzel, serif" font-weight="600">ORGANELLES ✠ </tspan><tspan>Nucleus controls · Mitochondria make ATP · Rough ER makes proteins · Smooth ER makes lipids and detoxifies · Golgi packages · Lysosomes digest · Ribosomes build · </tspan></textPath></text><text font-family="EB Garamond, Georgia, serif" font-size="15.00" fill="#2B2118"><textPath href="#tr4" startOffset="25.2" textLength="1391.8" lengthAdjust="spacing"><tspan fill="#9E2B1A" font-family="Cinzel, serif" font-weight="600">EPITHELIUM ✠ </tspan><tspan>Polar, apical over basal · tight sheets · on a basement membrane · avascular but innervated · regenerates · first name counts layers, second names the shape · </tspan></textPath></text><text font-family="EB Garamond, Georgia, serif" font-size="15.00" fill="#2B2118"><textPath href="#tr5" startOffset="29.1" textLength="1604.0" lengthAdjust="spacing"><tspan fill="#9E2B1A" font-family="Cinzel, serif" font-weight="600">GLANDS ✠ </tspan><tspan>Endocrine: ductless, hormones into the blood · Exocrine: through ducts · Merocrine by exocytosis, most common · Holocrine: the whole cell ruptures · </tspan></textPath></text><text font-family="EB Garamond, Georgia, serif" font-size="15.00" fill="#2B2118"><textPath href="#tr6" startOffset="32.9" textLength="1816.3" lengthAdjust="spacing"><tspan fill="#9E2B1A" font-family="Cinzel, serif" font-weight="600">MATRIX ✠ </tspan><tspan>Ground substance · Collagen for strength, elastic for recoil, reticular for nets · Blasts build the matrix, cytes maintain it · all from mesenchyme · </tspan></textPath></text><text font-family="EB Garamond, Georgia, serif" font-size="15.00" fill="#2B2118"><textPath href="#tr7" startOffset="36.8" textLength="2028.5" lengthAdjust="spacing"><tspan fill="#9E2B1A" font-family="Cinzel, serif" font-weight="600">CONNECTIVE ✠ </tspan><tspan>Proper: areolar, adipose, reticular, dense regular, dense irregular, elastic · Supporting: cartilage, avascular and slow to heal, and bone · Fluid: blood · </tspan></textPath></text><line x1="500" y1="422" x2="500" y2="142" stroke="#9E2B1A" stroke-width="1.4"></line><circle cx="500" cy="500" r="78" fill="#1F3F7A" stroke="#A8812A" stroke-width="3"></circle><circle cx="500" cy="500" r="71" fill="none" stroke="#A8812A" stroke-width="0.8"></circle><text x="500" y="490" text-anchor="middle" font-family="Cinzel, serif" font-weight="600" font-size="14" fill="#F3E9D2">TISSUE</text><text x="500" y="510" text-anchor="middle" font-family="EB Garamond, serif" font-style="italic" font-size="10.5" fill="#F3E9D2">similar cells,</text><text x="500" y="524" text-anchor="middle" font-family="EB Garamond, serif" font-style="italic" font-size="10.5" fill="#F3E9D2">one common job</text><circle cx="138" cy="138" r="112" fill="#EADBB8" stroke="#A8812A" stroke-width="2.5"></circle><circle cx="138" cy="138" r="86" fill="#F3E9D2" stroke="#2B2118" stroke-width="0.9"></circle><text font-family="EB Garamond, Georgia, serif" font-size="14.00" fill="#2B2118"><textPath href="#tc0" startOffset="8.9" textLength="572.9" lengthAdjust="spacing"><tspan fill="#9E2B1A" font-family="Cinzel, serif" font-weight="600">EPITHELIA ✠ </tspan><tspan>simple for absorption and filtration · stratified for protection · </tspan></textPath></text><text x="138" y="96" text-anchor="middle" font-family="Cinzel, serif" font-size="11.5" font-weight="600" fill="#1F3F7A">Simple squamous</text><text x="138" y="110" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">alveoli, glomeruli</text><text x="138" y="128" text-anchor="middle" font-family="Cinzel, serif" font-size="11.5" font-weight="600" fill="#1F3F7A">Pseudostratified</text><text x="138" y="142" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">trachea; all touch the</text><text x="138" y="155" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">base</text><text x="138" y="173" text-anchor="middle" font-family="Cinzel, serif" font-size="11.5" font-weight="600" fill="#1F3F7A">Transitional</text><text x="138" y="187" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">bladder; stretches</text><circle cx="862" cy="138" r="112" fill="#EADBB8" stroke="#A8812A" stroke-width="2.5"></circle><circle cx="862" cy="138" r="86" fill="#F3E9D2" stroke="#2B2118" stroke-width="0.9"></circle><text font-family="EB Garamond, Georgia, serif" font-size="14.00" fill="#2B2118"><textPath href="#tc1" startOffset="8.9" textLength="572.9" lengthAdjust="spacing"><tspan fill="#9E2B1A" font-family="Cinzel, serif" font-weight="600">CARTILAGE ✠ </tspan><tspan>chondrocytes in lacunae · stains purple · avascular, so slow to heal · </tspan></textPath></text><text x="862" y="96" text-anchor="middle" font-family="Cinzel, serif" font-size="11.5" font-weight="600" fill="#1F3F7A">Hyaline</text><text x="862" y="110" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">glassy, no visible</text><text x="862" y="123" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">fibers</text><text x="862" y="141" text-anchor="middle" font-family="Cinzel, serif" font-size="11.5" font-weight="600" fill="#1F3F7A">Elastic</text><text x="862" y="155" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">dark fibers; the ear</text><text x="862" y="173" text-anchor="middle" font-family="Cinzel, serif" font-size="11.5" font-weight="600" fill="#1F3F7A">Fibrocartilage</text><text x="862" y="187" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">thick collagen; discs</text><circle cx="138" cy="862" r="112" fill="#EADBB8" stroke="#A8812A" stroke-width="2.5"></circle><circle cx="138" cy="862" r="86" fill="#F3E9D2" stroke="#2B2118" stroke-width="0.9"></circle><text font-family="EB Garamond, Georgia, serif" font-size="12.44" fill="#2B2118"><textPath href="#tc2" startOffset="8.9" textLength="572.9" lengthAdjust="spacing"><tspan fill="#9E2B1A" font-family="Cinzel, serif" font-weight="600">MUSCLE ✠ </tspan><tspan>striated and voluntary: skeletal · intercalated discs: cardiac · no striations: smooth · </tspan></textPath></text><text x="138" y="814" text-anchor="middle" font-family="Cinzel, serif" font-size="11.5" font-weight="600" fill="#1F3F7A">Skeletal</text><text x="138" y="828" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">many nuclei at the edge</text><text x="138" y="846" text-anchor="middle" font-family="Cinzel, serif" font-size="11.5" font-weight="600" fill="#1F3F7A">Cardiac</text><text x="138" y="860" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">branched; one central</text><text x="138" y="872" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">nucleus</text><text x="138" y="890" text-anchor="middle" font-family="Cinzel, serif" font-size="11.5" font-weight="600" fill="#1F3F7A">Smooth</text><text x="138" y="904" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">spindle; oval central</text><text x="138" y="918" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">nucleus</text><circle cx="862" cy="862" r="112" fill="#EADBB8" stroke="#A8812A" stroke-width="2.5"></circle><circle cx="862" cy="862" r="86" fill="#F3E9D2" stroke="#2B2118" stroke-width="0.9"></circle><text font-family="EB Garamond, Georgia, serif" font-size="12.97" fill="#2B2118"><textPath href="#tc3" startOffset="8.9" textLength="572.9" lengthAdjust="spacing"><tspan fill="#9E2B1A" font-family="Cinzel, serif" font-weight="600">ON THE SLIDE ✠ </tspan><tspan>sheet of cells? epithelium · fluid? blood · rings? bone · lacunae? cartilage · </tspan></textPath></text><text x="862" y="820" text-anchor="middle" font-family="Cinzel, serif" font-size="11.5" font-weight="600" fill="#1F3F7A">Adipose</text><text x="862" y="834" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">signet ring, nucleus at</text><text x="862" y="847" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">edge</text><text x="862" y="865" text-anchor="middle" font-family="Cinzel, serif" font-size="11.5" font-weight="600" fill="#1F3F7A">Dense regular</text><text x="862" y="879" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">parallel wavy collagen</text><text x="862" y="897" text-anchor="middle" font-family="Cinzel, serif" font-size="11.5" font-weight="600" fill="#1F3F7A">Dense irregular</text><text x="862" y="911" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">bundles every direction</text><rect x="262" y="22" width="476" height="48" fill="#EADBB8" stroke="#A8812A" stroke-width="2"></rect><text x="500" y="40" text-anchor="middle" font-family="Cinzel, serif" font-size="12" font-weight="600" fill="#9E2B1A">✠ CELL DIVERSITY ✠</text><text x="500" y="59" text-anchor="middle" font-family="EB Garamond, serif" font-size="13" fill="#2B2118">Shape follows function: RBC, neuron, muscle, fat, macrophage, sperm</text><rect x="262" y="930" width="476" height="48" fill="#EADBB8" stroke="#A8812A" stroke-width="2"></rect><text x="500" y="948" text-anchor="middle" font-family="Cinzel, serif" font-size="12" font-weight="600" fill="#9E2B1A">✠ NERVOUS TISSUE ✠</text><text x="500" y="967" text-anchor="middle" font-family="EB Garamond, serif" font-size="13" fill="#2B2118">Soma: large purple body · Dendrites receive · Axon sends · Schwann cells myelinate</text></svg>