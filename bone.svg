<?xml version="1.0" encoding="UTF-8"?>
<svg style="background:#F3E9D2" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A circular study nota modeled on an osteon: rings of bone-tissue facts with four corner roundels on bone anatomy and fractures"><defs><style>@import url("https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;family=EB+Garamond:ital,wght@0,400;1,400&amp;display=swap");</style><path id="br0" d="M 500 410.12 A 89.88 89.88 0 1 1 500 589.88 A 89.88 89.88 0 1 1 500 410.12" fill="none"></path><path id="br1" d="M 500 374.12 A 125.88 125.88 0 1 1 500 625.88 A 125.88 125.88 0 1 1 500 374.12" fill="none"></path><path id="br2" d="M 500 338.12 A 161.88 161.88 0 1 1 500 661.88 A 161.88 161.88 0 1 1 500 338.12" fill="none"></path><path id="br3" d="M 500 302.12 A 197.88 197.88 0 1 1 500 697.88 A 197.88 197.88 0 1 1 500 302.12" fill="none"></path><path id="br4" d="M 500 266.12 A 233.88 233.88 0 1 1 500 733.88 A 233.88 233.88 0 1 1 500 266.12" fill="none"></path><path id="br5" d="M 500 230.12 A 269.88 269.88 0 1 1 500 769.88 A 269.88 269.88 0 1 1 500 230.12" fill="none"></path><path id="br6" d="M 500 194.12 A 305.88 305.88 0 1 1 500 805.88 A 305.88 305.88 0 1 1 500 194.12" fill="none"></path><path id="bc0" d="M 138 44 A 94 94 0 1 1 138 232 A 94 94 0 1 1 138 44" fill="none"></path><path id="bc1" d="M 862 44 A 94 94 0 1 1 862 232 A 94 94 0 1 1 862 44" fill="none"></path><path id="bc2" d="M 138 768 A 94 94 0 1 1 138 956 A 94 94 0 1 1 138 768" fill="none"></path><path id="bc3" d="M 862 768 A 94 94 0 1 1 862 956 A 94 94 0 1 1 862 768" fill="none"></path></defs><rect x="0" y="0" width="1000" height="1000" fill="#F3E9D2"></rect><rect x="12" y="12" width="976" height="976" fill="none" stroke="#A8812A" stroke-width="2"></rect><rect x="20" y="20" width="960" height="960" fill="none" stroke="#9E2B1A" stroke-width="0.8"></rect><line x1="256.8" y1="256.8" x2="218.6" y2="218.6" stroke="#9E2B1A" stroke-width="2.2"></line><line x1="256.8" y1="256.8" x2="218.6" y2="218.6" stroke="#F3E9D2" stroke-width="0.8"></line><line x1="743.2" y1="256.8" x2="781.4" y2="218.6" stroke="#9E2B1A" stroke-width="2.2"></line><line x1="743.2" y1="256.8" x2="781.4" y2="218.6" stroke="#F3E9D2" stroke-width="0.8"></line><line x1="256.8" y1="743.2" x2="218.6" y2="781.4" stroke="#9E2B1A" stroke-width="2.2"></line><line x1="256.8" y1="743.2" x2="218.6" y2="781.4" stroke="#F3E9D2" stroke-width="0.8"></line><line x1="743.2" y1="743.2" x2="781.4" y2="781.4" stroke="#9E2B1A" stroke-width="2.2"></line><line x1="743.2" y1="743.2" x2="781.4" y2="781.4" stroke="#F3E9D2" stroke-width="0.8"></line><circle cx="500" cy="500" r="344" fill="#F3E9D2" stroke="#A8812A" stroke-width="3"></circle><circle cx="500" cy="500" r="338" fill="none" stroke="#9E2B1A" stroke-width="1.2"></circle><circle cx="500" cy="500" r="330" fill="#EADBB8" stroke="#2B2118" stroke-width="0.9"></circle><circle cx="500" cy="500" r="294" fill="#F3E9D2" stroke="#2B2118" stroke-width="0.9"></circle><circle cx="500" cy="500" r="258" fill="#EADBB8" stroke="#2B2118" stroke-width="0.9"></circle><circle cx="500" cy="500" r="222" fill="#F3E9D2" stroke="#2B2118" stroke-width="0.9"></circle><circle cx="500" cy="500" r="186" fill="#EADBB8" stroke="#2B2118" stroke-width="0.9"></circle><circle cx="500" cy="500" r="150" fill="#F3E9D2" stroke="#2B2118" stroke-width="0.9"></circle><circle cx="500" cy="500" r="114" fill="#EADBB8" stroke="#2B2118" stroke-width="0.9"></circle><text font-family="EB Garamond, Georgia, serif" font-size="10.94" fill="#2B2118"><textPath href="#br0" startOffset="9.9" textLength="545.0" lengthAdjust="spacing"><tspan fill="#9E2B1A" font-family="Cinzel, serif" font-weight="600">CELLS ✠ </tspan><tspan>Osteogenic begets · Osteoblast builds osteoid · Osteocyte keeps the matrix · Osteoclast resorbs · </tspan></textPath></text><text font-family="EB Garamond, Georgia, serif" font-size="11.12" fill="#2B2118"><textPath href="#br1" startOffset="13.8" textLength="763.2" lengthAdjust="spacing"><tspan fill="#9E2B1A" font-family="Cinzel, serif" font-weight="600">GROWTH PLATE ✠ </tspan><tspan>Resting → Proliferation → Hypertrophic → Calcification → Ossification · HEALING ✠ Hematoma → Soft callus → Hard callus → Remodel · </tspan></textPath></text><text font-family="EB Garamond, Georgia, serif" font-size="13.47" fill="#2B2118"><textPath href="#br2" startOffset="17.8" textLength="981.5" lengthAdjust="spacing"><tspan fill="#9E2B1A" font-family="Cinzel, serif" font-weight="600">SEVEN FUNCTIONS ✠ </tspan><tspan>Support · Protection · Movement · Mineral &amp; growth-factor storage · Blood-cell formation · Triglyceride storage · Hormone: osteocalcin · </tspan></textPath></text><text font-family="EB Garamond, Georgia, serif" font-size="16.00" fill="#2B2118"><textPath href="#br3" startOffset="21.8" textLength="1199.8" lengthAdjust="spacing"><tspan fill="#9E2B1A" font-family="Cinzel, serif" font-weight="600">CALCIUM ✠ </tspan><tspan>Low Ca²⁺ → parathyroid releases PTH → osteoclasts resorb → Ca²⁺ rises · High Ca²⁺ → calcitonin from parafollicular cells, its effect negligible · </tspan></textPath></text><text font-family="EB Garamond, Georgia, serif" font-size="16.00" fill="#2B2118"><textPath href="#br4" startOffset="25.7" textLength="1418.1" lengthAdjust="spacing"><tspan fill="#9E2B1A" font-family="Cinzel, serif" font-weight="600">OSSIFICATION ✠ </tspan><tspan>Intramembranous: bone within a fibrous membrane, mesenchyme → osteogenic → osteoblast · Endochondral: bone replaces a hyaline model, and so is slower · </tspan></textPath></text><text font-family="EB Garamond, Georgia, serif" font-size="16.00" fill="#2B2118"><textPath href="#br5" startOffset="29.7" textLength="1636.4" lengthAdjust="spacing"><tspan fill="#9E2B1A" font-family="Cinzel, serif" font-weight="600">CARTILAGE ✠ </tspan><tspan>Hyaline: articular, costal, respiratory, nasal · Elastic: ear, epiglottis · Fibrocartilage: menisci, discs · Appositional grows at the surface, interstitial from within · </tspan></textPath></text><text font-family="EB Garamond, Georgia, serif" font-size="16.00" fill="#2B2118"><textPath href="#br6" startOffset="33.6" textLength="1854.6" lengthAdjust="spacing"><tspan fill="#9E2B1A" font-family="Cinzel, serif" font-weight="600">COMPOSITION ✠ </tspan><tspan>Organic: cells and osteoid, whose collagen gives tensile strength and flexibility · Inorganic: hydroxyapatite, about 65% of bone mass, gives hardness and resists compression · </tspan></textPath></text><line x1="500" y1="422" x2="500" y2="170" stroke="#9E2B1A" stroke-width="1.4"></line><circle cx="500" cy="500" r="78" fill="#1F3F7A" stroke="#A8812A" stroke-width="3"></circle><circle cx="500" cy="500" r="71" fill="none" stroke="#A8812A" stroke-width="0.8"></circle><text x="500" y="478" text-anchor="middle" font-family="Cinzel, serif" font-weight="600" font-size="14" fill="#F3E9D2">CENTRAL</text><text x="500" y="496" text-anchor="middle" font-family="Cinzel, serif" font-weight="600" font-size="14" fill="#F3E9D2">CANAL</text><text x="500" y="520" text-anchor="middle" font-family="EB Garamond, serif" font-style="italic" font-size="15" fill="#F3E9D2">Bone is alive</text><text x="500" y="536" text-anchor="middle" font-family="EB Garamond, serif" font-style="italic" font-size="8.6" fill="#F3E9D2">it builds, keeps &amp; breaks down</text><circle cx="138" cy="138" r="112" fill="#EADBB8" stroke="#A8812A" stroke-width="2.5"></circle><circle cx="138" cy="138" r="86" fill="#F3E9D2" stroke="#2B2118" stroke-width="0.9"></circle><text font-family="EB Garamond, Georgia, serif" font-size="12.97" fill="#2B2118"><textPath href="#bc0" startOffset="8.9" textLength="572.9" lengthAdjust="spacing"><tspan fill="#9E2B1A" font-family="Cinzel, serif" font-weight="600">LONG BONE ✠ </tspan><tspan>diaphysis: shaft · epiphyses: ends · articular cartilage caps · epiphyseal line · </tspan></textPath></text><text x="138" y="96" text-anchor="middle" font-family="Cinzel, serif" font-size="11.5" font-weight="600" fill="#1F3F7A">Periosteum</text><text x="138" y="110" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">outside, not at joints</text><text x="138" y="128" text-anchor="middle" font-family="Cinzel, serif" font-size="11.5" font-weight="600" fill="#1F3F7A">Endosteum</text><text x="138" y="142" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">inside surfaces, canals</text><text x="138" y="160" text-anchor="middle" font-family="Cinzel, serif" font-size="11.5" font-weight="600" fill="#1F3F7A">Marrow</text><text x="138" y="174" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">red makes blood; yellow</text><text x="138" y="187" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">can turn red</text><circle cx="862" cy="138" r="112" fill="#EADBB8" stroke="#A8812A" stroke-width="2.5"></circle><circle cx="862" cy="138" r="86" fill="#F3E9D2" stroke="#2B2118" stroke-width="0.9"></circle><text font-family="EB Garamond, Georgia, serif" font-size="12.70" fill="#2B2118"><textPath href="#bc1" startOffset="8.9" textLength="572.9" lengthAdjust="spacing"><tspan fill="#9E2B1A" font-family="Cinzel, serif" font-weight="600">OSTEON ✠ </tspan><tspan>the weight-bearing pillar of compact bone · lamellae in rings · spongy bone has none · </tspan></textPath></text><text x="862" y="90" text-anchor="middle" font-family="Cinzel, serif" font-size="11.5" font-weight="600" fill="#1F3F7A">Central canal</text><text x="862" y="104" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">vessels and nerves</text><text x="862" y="122" text-anchor="middle" font-family="Cinzel, serif" font-size="11.5" font-weight="600" fill="#1F3F7A">Perforating canal</text><text x="862" y="136" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">at right angles,</text><text x="862" y="148" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">linking</text><text x="862" y="166" text-anchor="middle" font-family="Cinzel, serif" font-size="11.5" font-weight="600" fill="#1F3F7A">Lacunae · canaliculi</text><text x="862" y="180" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">cell homes and their</text><text x="862" y="194" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">channels</text><circle cx="138" cy="862" r="112" fill="#EADBB8" stroke="#A8812A" stroke-width="2.5"></circle><circle cx="138" cy="862" r="86" fill="#F3E9D2" stroke="#2B2118" stroke-width="0.9"></circle><text font-family="EB Garamond, Georgia, serif" font-size="14.00" fill="#2B2118"><textPath href="#bc2" startOffset="8.9" textLength="572.9" lengthAdjust="spacing"><tspan fill="#9E2B1A" font-family="Cinzel, serif" font-weight="600">BONE TYPES ✠ </tspan><tspan>axial: skull, spine, rib cage · appendicular: limbs and girdles · </tspan></textPath></text><text x="138" y="807" text-anchor="middle" font-family="Cinzel, serif" font-size="11.5" font-weight="600" fill="#1F3F7A">Shapes</text><text x="138" y="821" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">long, short, flat,</text><text x="138" y="834" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">irregular, sesamoid</text><text x="138" y="852" text-anchor="middle" font-family="Cinzel, serif" font-size="11.5" font-weight="600" fill="#1F3F7A">Compact</text><text x="138" y="866" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">dense, smooth outer</text><text x="138" y="879" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">layer</text><text x="138" y="897" text-anchor="middle" font-family="Cinzel, serif" font-size="11.5" font-weight="600" fill="#1F3F7A">Spongy</text><text x="138" y="911" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">trabeculae along stress</text><text x="138" y="924" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">lines</text><circle cx="862" cy="862" r="112" fill="#EADBB8" stroke="#A8812A" stroke-width="2.5"></circle><circle cx="862" cy="862" r="86" fill="#F3E9D2" stroke="#2B2118" stroke-width="0.9"></circle><text font-family="EB Garamond, Georgia, serif" font-size="14.00" fill="#2B2118"><textPath href="#bc3" startOffset="8.9" textLength="572.9" lengthAdjust="spacing"><tspan fill="#9E2B1A" font-family="Cinzel, serif" font-weight="600">FRACTURES ✠ </tspan><tspan>reduction realigns the ends: closed by hand, open with pins or wires · </tspan></textPath></text><text x="862" y="807" text-anchor="middle" font-family="Cinzel, serif" font-size="11.5" font-weight="600" fill="#1F3F7A">Displaced?</text><text x="862" y="821" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">ends out of alignment</text><text x="862" y="834" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">or not</text><text x="862" y="852" text-anchor="middle" font-family="Cinzel, serif" font-size="11.5" font-weight="600" fill="#1F3F7A">Complete?</text><text x="862" y="866" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">through the whole bone</text><text x="862" y="879" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">or not</text><text x="862" y="897" text-anchor="middle" font-family="Cinzel, serif" font-size="11.5" font-weight="600" fill="#1F3F7A">Open?</text><text x="862" y="911" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">skin broken (compound)</text><text x="862" y="924" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">or closed</text><rect x="262" y="22" width="476" height="48" fill="#EADBB8" stroke="#A8812A" stroke-width="2"></rect><text x="500" y="40" text-anchor="middle" font-family="Cinzel, serif" font-size="12" font-weight="600" fill="#9E2B1A">✠ GROWTH HORMONES ✠</text><text x="500" y="59" text-anchor="middle" font-family="EB Garamond, serif" font-size="13" fill="#2B2118">Growth hormone drives the plate · Thyroid keeps proportion · Sex hormones spur, then close</text><rect x="262" y="930" width="476" height="48" fill="#EADBB8" stroke="#A8812A" stroke-width="2"></rect><text x="500" y="948" text-anchor="middle" font-family="Cinzel, serif" font-size="12" font-weight="600" fill="#9E2B1A">✠ BONE DISORDERS ✠</text><text x="500" y="967" text-anchor="middle" font-family="EB Garamond, serif" font-size="13" fill="#2B2118">Osteomalacia · Rickets · Osteoporosis (resorption &gt; deposit) · Paget’s</text></svg>