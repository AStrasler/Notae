<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A circular study nota on body orientation: rings on homeostasis, life functions, directions, planes, cavities and organ systems, with corners on regions, the microscope and serous membranes"><defs><style>@import url("https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;family=EB+Garamond:ital,wght@0,400;1,400&amp;display=swap");</style><path id="or0" d="M 500 410.45 A 89.55 89.55 0 1 1 500 589.55 A 89.55 89.55 0 1 1 500 410.45" fill="none"></path><path id="or1" d="M 500 375.45 A 124.55 124.55 0 1 1 500 624.55 A 124.55 124.55 0 1 1 500 375.45" fill="none"></path><path id="or2" d="M 500 340.45 A 159.55 159.55 0 1 1 500 659.55 A 159.55 159.55 0 1 1 500 340.45" fill="none"></path><path id="or3" d="M 500 305.45 A 194.55 194.55 0 1 1 500 694.55 A 194.55 194.55 0 1 1 500 305.45" fill="none"></path><path id="or4" d="M 500 270.45 A 229.55 229.55 0 1 1 500 729.55 A 229.55 229.55 0 1 1 500 270.45" fill="none"></path><path id="or5" d="M 500 235.45 A 264.55 264.55 0 1 1 500 764.55 A 264.55 264.55 0 1 1 500 235.45" fill="none"></path><path id="or6" d="M 500 200.45 A 299.55 299.55 0 1 1 500 799.55 A 299.55 299.55 0 1 1 500 200.45" fill="none"></path><path id="or7" d="M 500 165.45 A 334.55 334.55 0 1 1 500 834.55 A 334.55 334.55 0 1 1 500 165.45" fill="none"></path><path id="oc0" d="M 138 44 A 94 94 0 1 1 138 232 A 94 94 0 1 1 138 44" fill="none"></path><path id="oc1" d="M 862 44 A 94 94 0 1 1 862 232 A 94 94 0 1 1 862 44" fill="none"></path><path id="oc2" d="M 138 768 A 94 94 0 1 1 138 956 A 94 94 0 1 1 138 768" fill="none"></path><path id="oc3" d="M 862 768 A 94 94 0 1 1 862 956 A 94 94 0 1 1 862 768" fill="none"></path></defs><rect x="0" y="0" width="1000" height="1000" fill="#F3E9D2"></rect><rect x="12" y="12" width="976" height="976" fill="none" stroke="#A8812A" stroke-width="2"></rect><rect x="20" y="20" width="960" height="960" fill="none" stroke="#9E2B1A" stroke-width="0.8"></rect><line x1="237.0" y1="237.0" x2="218.6" y2="218.6" stroke="#9E2B1A" stroke-width="2.2"></line><line x1="237.0" y1="237.0" x2="218.6" y2="218.6" stroke="#F3E9D2" stroke-width="0.8"></line><line x1="763.0" y1="237.0" x2="781.4" y2="218.6" stroke="#9E2B1A" stroke-width="2.2"></line><line x1="763.0" y1="237.0" x2="781.4" y2="218.6" stroke="#F3E9D2" stroke-width="0.8"></line><line x1="237.0" y1="763.0" x2="218.6" y2="781.4" stroke="#9E2B1A" stroke-width="2.2"></line><line x1="237.0" y1="763.0" x2="218.6" y2="781.4" stroke="#F3E9D2" stroke-width="0.8"></line><line x1="763.0" y1="763.0" x2="781.4" y2="781.4" stroke="#9E2B1A" stroke-width="2.2"></line><line x1="763.0" y1="763.0" x2="781.4" y2="781.4" stroke="#F3E9D2" stroke-width="0.8"></line><circle cx="500" cy="500" r="372" fill="#F3E9D2" stroke="#A8812A" stroke-width="3"></circle><circle cx="500" cy="500" r="366" fill="none" stroke="#9E2B1A" stroke-width="1.2"></circle><circle cx="500" cy="500" r="358" fill="#F3E9D2" stroke="#2B2118" stroke-width="0.9"></circle><circle cx="500" cy="500" r="323" fill="#EADBB8" stroke="#2B2118" stroke-width="0.9"></circle><circle cx="500" cy="500" r="288" fill="#F3E9D2" stroke="#2B2118" stroke-width="0.9"></circle><circle cx="500" cy="500" r="253" fill="#EADBB8" stroke="#2B2118" stroke-width="0.9"></circle><circle cx="500" cy="500" r="218" fill="#F3E9D2" stroke="#2B2118" stroke-width="0.9"></circle><circle cx="500" cy="500" r="183" fill="#EADBB8" stroke="#2B2118" stroke-width="0.9"></circle><circle cx="500" cy="500" r="148" fill="#F3E9D2" stroke="#2B2118" stroke-width="0.9"></circle><circle cx="500" cy="500" r="113" fill="#EADBB8" stroke="#2B2118" stroke-width="0.9"></circle><text font-family="EB Garamond, Georgia, serif" font-size="11.33" fill="#2B2118"><textPath href="#or0" startOffset="9.8" textLength="543.0" lengthAdjust="spacing"><tspan fill="#9E2B1A" font-family="Cinzel, serif" font-weight="600">CONTROL ✠ </tspan><tspan>Receptor senses → afferent → control center sets the point → efferent → effector responds · </tspan></textPath></text><text font-family="EB Garamond, Georgia, serif" font-size="13.50" fill="#2B2118"><textPath href="#or1" startOffset="13.7" textLength="755.2" lengthAdjust="spacing"><tspan fill="#9E2B1A" font-family="Cinzel, serif" font-weight="600">FEEDBACK ✠ </tspan><tspan>Negative, most common, reverses the change: temperature, glucose · Positive amplifies it: labor, clotting · </tspan></textPath></text><text font-family="EB Garamond, Georgia, serif" font-size="13.72" fill="#2B2118"><textPath href="#or2" startOffset="17.5" textLength="967.4" lengthAdjust="spacing"><tspan fill="#9E2B1A" font-family="Cinzel, serif" font-weight="600">SURVIVAL NEEDS ✠ </tspan><tspan>Nutrients · Oxygen · Water · Normal body temperature, about 37°C · Appropriate atmospheric pressure · too much or too little harms · </tspan></textPath></text><text font-family="EB Garamond, Georgia, serif" font-size="15.00" fill="#2B2118"><textPath href="#or3" startOffset="21.4" textLength="1179.6" lengthAdjust="spacing"><tspan fill="#9E2B1A" font-family="Cinzel, serif" font-weight="600">LIFE FUNCTIONS ✠ </tspan><tspan>Maintaining boundaries · Movement · Responsiveness · Digestion · Metabolism, catabolism plus anabolism · Excretion · Reproduction · Growth · </tspan></textPath></text><text font-family="EB Garamond, Georgia, serif" font-size="15.00" fill="#2B2118"><textPath href="#or4" startOffset="25.2" textLength="1391.8" lengthAdjust="spacing"><tspan fill="#9E2B1A" font-family="Cinzel, serif" font-weight="600">DIRECTIONS ✠ </tspan><tspan>Superior and inferior · Anterior and posterior · Medial and lateral · Proximal and distal · Superficial and deep · always the patient’s own right and left · </tspan></textPath></text><text font-family="EB Garamond, Georgia, serif" font-size="15.00" fill="#2B2118"><textPath href="#or5" startOffset="29.1" textLength="1604.0" lengthAdjust="spacing"><tspan fill="#9E2B1A" font-family="Cinzel, serif" font-weight="600">PLANES ✠ </tspan><tspan>Sagittal splits right from left, midsagittal on the midline · Frontal or coronal splits front from back · Transverse or axial splits top from bottom · Oblique cuts at an angle · </tspan></textPath></text><text font-family="EB Garamond, Georgia, serif" font-size="15.00" fill="#2B2118"><textPath href="#or6" startOffset="32.9" textLength="1816.3" lengthAdjust="spacing"><tspan fill="#9E2B1A" font-family="Cinzel, serif" font-weight="600">CAVITIES ✠ </tspan><tspan>Dorsal: cranial and vertebral · Ventral: thoracic above the diaphragm, with two pleural cavities and the mediastinum around the pericardial · abdominopelvic below · </tspan></textPath></text><text font-family="EB Garamond, Georgia, serif" font-size="15.00" fill="#2B2118"><textPath href="#or7" startOffset="36.8" textLength="2028.5" lengthAdjust="spacing"><tspan fill="#9E2B1A" font-family="Cinzel, serif" font-weight="600">ORGAN SYSTEMS ✠ </tspan><tspan>Integumentary · Skeletal · Muscular · Nervous · Endocrine · Cardiovascular · Lymphatic · Respiratory · Digestive · Urinary · Reproductive · all serve homeostasis · </tspan></textPath></text><line x1="500" y1="422" x2="500" y2="142" stroke="#9E2B1A" stroke-width="1.4"></line><circle cx="500" cy="500" r="78" fill="#1F3F7A" stroke="#A8812A" stroke-width="3"></circle><circle cx="500" cy="500" r="71" fill="none" stroke="#A8812A" stroke-width="0.8"></circle><text x="500" y="490" text-anchor="middle" font-family="Cinzel, serif" font-weight="600" font-size="14" fill="#F3E9D2">HOMEOSTASIS</text><text x="500" y="510" text-anchor="middle" font-family="EB Garamond, serif" font-style="italic" font-size="10.5" fill="#F3E9D2">a stable inside</text><text x="500" y="524" text-anchor="middle" font-family="EB Garamond, serif" font-style="italic" font-size="10.5" fill="#F3E9D2">in a changing world</text><circle cx="138" cy="138" r="112" fill="#EADBB8" stroke="#A8812A" stroke-width="2.5"></circle><circle cx="138" cy="138" r="86" fill="#F3E9D2" stroke="#2B2118" stroke-width="0.9"></circle><text font-family="EB Garamond, Georgia, serif" font-size="14.00" fill="#2B2118"><textPath href="#oc0" startOffset="8.9" textLength="572.9" lengthAdjust="spacing"><tspan fill="#9E2B1A" font-family="Cinzel, serif" font-weight="600">QUADRANTS ✠ </tspan><tspan>RUQ: liver, gallbladder · LUQ: spleen, stomach · RLQ: appendix · and LLQ · </tspan></textPath></text><text x="138" y="89" text-anchor="middle" font-family="Cinzel, serif" font-size="11.5" font-weight="600" fill="#1F3F7A">Nine regions</text><text x="138" y="103" text-anchor="middle" font-family="Cinzel, serif" font-size="11.5" font-weight="600" fill="#1F3F7A">Top</text><text x="138" y="117" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">hypochondriac,</text><text x="138" y="130" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">epigastric</text><text x="138" y="148" text-anchor="middle" font-family="Cinzel, serif" font-size="11.5" font-weight="600" fill="#1F3F7A">Middle</text><text x="138" y="162" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">lumbar, umbilical</text><text x="138" y="180" text-anchor="middle" font-family="Cinzel, serif" font-size="11.5" font-weight="600" fill="#1F3F7A">Bottom</text><text x="138" y="194" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">iliac, hypogastric</text><circle cx="862" cy="138" r="112" fill="#EADBB8" stroke="#A8812A" stroke-width="2.5"></circle><circle cx="862" cy="138" r="86" fill="#F3E9D2" stroke="#2B2118" stroke-width="0.9"></circle><text font-family="EB Garamond, Georgia, serif" font-size="14.00" fill="#2B2118"><textPath href="#oc1" startOffset="8.9" textLength="572.9" lengthAdjust="spacing"><tspan fill="#9E2B1A" font-family="Cinzel, serif" font-weight="600">BODY REGIONS ✠ </tspan><tspan>axial: head, neck, trunk · appendicular: the limbs · </tspan></textPath></text><text x="862" y="83" text-anchor="middle" font-family="Cinzel, serif" font-size="11.5" font-weight="600" fill="#1F3F7A">Front</text><text x="862" y="97" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">cephalic, cervical,</text><text x="862" y="110" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">thoracic, inguinal</text><text x="862" y="128" text-anchor="middle" font-family="Cinzel, serif" font-size="11.5" font-weight="600" fill="#1F3F7A">Back</text><text x="862" y="142" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">occipital, lumbar,</text><text x="862" y="155" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">gluteal, popliteal</text><text x="862" y="173" text-anchor="middle" font-family="Cinzel, serif" font-size="11.5" font-weight="600" fill="#1F3F7A">Limbs</text><text x="862" y="187" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">brachial, antecubital,</text><text x="862" y="200" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">femoral, crural</text><circle cx="138" cy="862" r="112" fill="#EADBB8" stroke="#A8812A" stroke-width="2.5"></circle><circle cx="138" cy="862" r="86" fill="#F3E9D2" stroke="#2B2118" stroke-width="0.9"></circle><text font-family="EB Garamond, Georgia, serif" font-size="12.44" fill="#2B2118"><textPath href="#oc2" startOffset="8.9" textLength="572.9" lengthAdjust="spacing"><tspan fill="#9E2B1A" font-family="Cinzel, serif" font-weight="600">MICROSCOPE ✠ </tspan><tspan>carry with two hands · lens paper only · start at lowest power · store on scanning · </tspan></textPath></text><text x="138" y="820" text-anchor="middle" font-family="Cinzel, serif" font-size="11.5" font-weight="600" fill="#1F3F7A">Coarse knob</text><text x="138" y="834" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">scanning, 4X, only</text><text x="138" y="852" text-anchor="middle" font-family="Cinzel, serif" font-size="11.5" font-weight="600" fill="#1F3F7A">Fields</text><text x="138" y="866" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">4X 4.7 mm · 10X 1.8 mm</text><text x="138" y="879" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">· 40X 0.5 mm</text><text x="138" y="897" text-anchor="middle" font-family="Cinzel, serif" font-size="11.5" font-weight="600" fill="#1F3F7A">Formula</text><text x="138" y="911" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">M₁ × D₁ = M₂ × D₂</text><circle cx="862" cy="862" r="112" fill="#EADBB8" stroke="#A8812A" stroke-width="2.5"></circle><circle cx="862" cy="862" r="86" fill="#F3E9D2" stroke="#2B2118" stroke-width="0.9"></circle><text font-family="EB Garamond, Georgia, serif" font-size="14.00" fill="#2B2118"><textPath href="#oc3" startOffset="8.9" textLength="572.9" lengthAdjust="spacing"><tspan fill="#9E2B1A" font-family="Cinzel, serif" font-weight="600">SEROUS MEMBRANES ✠ </tspan><tspan>pericardium · pleurae · peritoneum · fluid between cuts friction · </tspan></textPath></text><text x="862" y="826" text-anchor="middle" font-family="Cinzel, serif" font-size="11.5" font-weight="600" fill="#1F3F7A">Parietal</text><text x="862" y="840" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">lines the cavity wall</text><text x="862" y="858" text-anchor="middle" font-family="Cinzel, serif" font-size="11.5" font-weight="600" fill="#1F3F7A">Visceral</text><text x="862" y="872" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">covers the organ</text><text x="862" y="890" text-anchor="middle" font-family="Cinzel, serif" font-size="11.5" font-weight="600" fill="#1F3F7A">-itis</text><text x="862" y="904" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">pleurisy, peritonitis</text><rect x="262" y="22" width="476" height="48" fill="#EADBB8" stroke="#A8812A" stroke-width="2"></rect><text x="500" y="40" text-anchor="middle" font-family="Cinzel, serif" font-size="12" font-weight="600" fill="#9E2B1A">✠ ANATOMICAL POSITION ✠</text><text x="500" y="59" text-anchor="middle" font-family="EB Garamond, serif" font-size="13" fill="#2B2118">Erect, feet apart, palms forward, thumbs out · right and left are the patient’s</text><rect x="262" y="930" width="476" height="48" fill="#EADBB8" stroke="#A8812A" stroke-width="2"></rect><text x="500" y="948" text-anchor="middle" font-family="Cinzel, serif" font-size="12" font-weight="600" fill="#9E2B1A">✠ WHEN BALANCE FAILS ✠</text><text x="500" y="967" text-anchor="middle" font-family="EB Garamond, serif" font-size="13" fill="#2B2118">Homeostatic imbalance often results in disease</text></svg>