<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A circular study nota on the skin: rings on skin regions, epidermal cells, functions, color, layers, dermis, glands and clinical color changes, with corners on hair, nails, skin cancer and burns"><defs><style>@import url("https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;family=EB+Garamond:ital,wght@0,400;1,400&amp;display=swap");</style><path id="sr0" d="M 500 410.45 A 89.55 89.55 0 1 1 500 589.55 A 89.55 89.55 0 1 1 500 410.45" fill="none"></path><path id="sr1" d="M 500 375.45 A 124.55 124.55 0 1 1 500 624.55 A 124.55 124.55 0 1 1 500 375.45" fill="none"></path><path id="sr2" d="M 500 340.45 A 159.55 159.55 0 1 1 500 659.55 A 159.55 159.55 0 1 1 500 340.45" fill="none"></path><path id="sr3" d="M 500 305.45 A 194.55 194.55 0 1 1 500 694.55 A 194.55 194.55 0 1 1 500 305.45" fill="none"></path><path id="sr4" d="M 500 270.45 A 229.55 229.55 0 1 1 500 729.55 A 229.55 229.55 0 1 1 500 270.45" fill="none"></path><path id="sr5" d="M 500 235.45 A 264.55 264.55 0 1 1 500 764.55 A 264.55 264.55 0 1 1 500 235.45" fill="none"></path><path id="sr6" d="M 500 200.45 A 299.55 299.55 0 1 1 500 799.55 A 299.55 299.55 0 1 1 500 200.45" fill="none"></path><path id="sr7" d="M 500 165.45 A 334.55 334.55 0 1 1 500 834.55 A 334.55 334.55 0 1 1 500 165.45" fill="none"></path><path id="sc0" d="M 138 44 A 94 94 0 1 1 138 232 A 94 94 0 1 1 138 44" fill="none"></path><path id="sc1" d="M 862 44 A 94 94 0 1 1 862 232 A 94 94 0 1 1 862 44" fill="none"></path><path id="sc2" d="M 138 768 A 94 94 0 1 1 138 956 A 94 94 0 1 1 138 768" fill="none"></path><path id="sc3" d="M 862 768 A 94 94 0 1 1 862 956 A 94 94 0 1 1 862 768" fill="none"></path></defs><rect x="0" y="0" width="1000" height="1000" fill="#F3E9D2"></rect><rect x="12" y="12" width="976" height="976" fill="none" stroke="#A8812A" stroke-width="2"></rect><rect x="20" y="20" width="960" height="960" fill="none" stroke="#9E2B1A" stroke-width="0.8"></rect><line x1="237.0" y1="237.0" x2="218.6" y2="218.6" stroke="#9E2B1A" stroke-width="2.2"></line><line x1="237.0" y1="237.0" x2="218.6" y2="218.6" stroke="#F3E9D2" stroke-width="0.8"></line><line x1="763.0" y1="237.0" x2="781.4" y2="218.6" stroke="#9E2B1A" stroke-width="2.2"></line><line x1="763.0" y1="237.0" x2="781.4" y2="218.6" stroke="#F3E9D2" stroke-width="0.8"></line><line x1="237.0" y1="763.0" x2="218.6" y2="781.4" stroke="#9E2B1A" stroke-width="2.2"></line><line x1="237.0" y1="763.0" x2="218.6" y2="781.4" stroke="#F3E9D2" stroke-width="0.8"></line><line x1="763.0" y1="763.0" x2="781.4" y2="781.4" stroke="#9E2B1A" stroke-width="2.2"></line><line x1="763.0" y1="763.0" x2="781.4" y2="781.4" stroke="#F3E9D2" stroke-width="0.8"></line><circle cx="500" cy="500" r="372" fill="#F3E9D2" stroke="#A8812A" stroke-width="3"></circle><circle cx="500" cy="500" r="366" fill="none" stroke="#9E2B1A" stroke-width="1.2"></circle><circle cx="500" cy="500" r="358" fill="#F3E9D2" stroke="#2B2118" stroke-width="0.9"></circle><circle cx="500" cy="500" r="323" fill="#EADBB8" stroke="#2B2118" stroke-width="0.9"></circle><circle cx="500" cy="500" r="288" fill="#F3E9D2" stroke="#2B2118" stroke-width="0.9"></circle><circle cx="500" cy="500" r="253" fill="#EADBB8" stroke="#2B2118" stroke-width="0.9"></circle><circle cx="500" cy="500" r="218" fill="#F3E9D2" stroke="#2B2118" stroke-width="0.9"></circle><circle cx="500" cy="500" r="183" fill="#EADBB8" stroke="#2B2118" stroke-width="0.9"></circle><circle cx="500" cy="500" r="148" fill="#F3E9D2" stroke="#2B2118" stroke-width="0.9"></circle><circle cx="500" cy="500" r="113" fill="#EADBB8" stroke="#2B2118" stroke-width="0.9"></circle><text font-family="EB Garamond, Georgia, serif" font-size="11.33" fill="#2B2118"><textPath href="#sr0" startOffset="9.8" textLength="543.0" lengthAdjust="spacing"><tspan fill="#9E2B1A" font-family="Cinzel, serif" font-weight="600">REGIONS ✠ </tspan><tspan>Epidermis: avascular epithelium · Dermis: vascular connective · Hypodermis: fat, not skin · </tspan></textPath></text><text font-family="EB Garamond, Georgia, serif" font-size="13.28" fill="#2B2118"><textPath href="#sr1" startOffset="13.7" textLength="755.2" lengthAdjust="spacing"><tspan fill="#9E2B1A" font-family="Cinzel, serif" font-weight="600">FOUR CELLS ✠ </tspan><tspan>Keratinocytes make keratin · Melanocytes make melanin · Dendritic cells guard · Tactile cells sense touch · </tspan></textPath></text><text font-family="EB Garamond, Georgia, serif" font-size="15.00" fill="#2B2118"><textPath href="#sr2" startOffset="17.5" textLength="967.4" lengthAdjust="spacing"><tspan fill="#9E2B1A" font-family="Cinzel, serif" font-weight="600">FUNCTIONS ✠ </tspan><tspan>Protection: chemical, physical, biological · Temperature · Sensation · Vitamin D · Blood reservoir · Excretion · </tspan></textPath></text><text font-family="EB Garamond, Georgia, serif" font-size="15.00" fill="#2B2118"><textPath href="#sr3" startOffset="21.4" textLength="1179.6" lengthAdjust="spacing"><tspan fill="#9E2B1A" font-family="Cinzel, serif" font-weight="600">COLOR ✠ </tspan><tspan>Melanin, the only pigment made in skin · Carotene, yellow-orange · Hemoglobin, pink · amount and form of melanin, not melanocyte count · </tspan></textPath></text><text font-family="EB Garamond, Georgia, serif" font-size="15.00" fill="#2B2118"><textPath href="#sr4" startOffset="25.2" textLength="1391.8" lengthAdjust="spacing"><tspan fill="#9E2B1A" font-family="Cinzel, serif" font-weight="600">LAYERS ✠ </tspan><tspan>Basale divides → Spinosum prickles → Granulosum begins keratin → Lucidum, thick skin only → Corneum, dead and shed · Come Let’s Get Sun Burned · </tspan></textPath></text><text font-family="EB Garamond, Georgia, serif" font-size="15.00" fill="#2B2118"><textPath href="#sr5" startOffset="29.1" textLength="1604.0" lengthAdjust="spacing"><tspan fill="#9E2B1A" font-family="Cinzel, serif" font-weight="600">DERMIS ✠ </tspan><tspan>Papillary: areolar, capillary loops, Meissner’s light touch · Reticular: dense irregular, 80%, Pacinian deep pressure · cut along cleavage lines · </tspan></textPath></text><text font-family="EB Garamond, Georgia, serif" font-size="15.00" fill="#2B2118"><textPath href="#sr6" startOffset="32.9" textLength="1816.3" lengthAdjust="spacing"><tspan fill="#9E2B1A" font-family="Cinzel, serif" font-weight="600">GLANDS ✠ </tspan><tspan>Eccrine: most numerous, true sweat to a pore · Apocrine: into follicles, armpit and groin, from puberty · Sebaceous: oily sebum, holocrine · </tspan></textPath></text><text font-family="EB Garamond, Georgia, serif" font-size="15.00" fill="#2B2118"><textPath href="#sr7" startOffset="36.8" textLength="2028.5" lengthAdjust="spacing"><tspan fill="#9E2B1A" font-family="Cinzel, serif" font-weight="600">CLINICAL COLOR ✠ </tspan><tspan>Cyanosis, blue from low oxygen · Pallor, pale · Erythema, red · Jaundice, yellow from bilirubin · Bruise, blood in the tissue · Dark necklace, insulin resistance · </tspan></textPath></text><line x1="500" y1="422" x2="500" y2="142" stroke="#9E2B1A" stroke-width="1.4"></line><circle cx="500" cy="500" r="78" fill="#1F3F7A" stroke="#A8812A" stroke-width="3"></circle><circle cx="500" cy="500" r="71" fill="none" stroke="#A8812A" stroke-width="0.8"></circle><text x="500" y="490" text-anchor="middle" font-family="Cinzel, serif" font-weight="600" font-size="14" fill="#F3E9D2">SKIN</text><text x="500" y="510" text-anchor="middle" font-family="EB Garamond, serif" font-style="italic" font-size="10.5" fill="#F3E9D2">the body’s</text><text x="500" y="524" text-anchor="middle" font-family="EB Garamond, serif" font-style="italic" font-size="10.5" fill="#F3E9D2">boundary</text><circle cx="138" cy="138" r="112" fill="#EADBB8" stroke="#A8812A" stroke-width="2.5"></circle><circle cx="138" cy="138" r="86" fill="#F3E9D2" stroke="#2B2118" stroke-width="0.9"></circle><text font-family="EB Garamond, Georgia, serif" font-size="14.00" fill="#2B2118"><textPath href="#sc0" startOffset="8.9" textLength="572.9" lengthAdjust="spacing"><tspan fill="#9E2B1A" font-family="Cinzel, serif" font-weight="600">HAIR ✠ </tspan><tspan>shaft above the skin · root below it · bulb at the deep end · </tspan></textPath></text><text x="138" y="90" text-anchor="middle" font-family="Cinzel, serif" font-size="11.5" font-weight="600" fill="#1F3F7A">Matrix</text><text x="138" y="104" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">dividing cells make</text><text x="138" y="116" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">hair</text><text x="138" y="134" text-anchor="middle" font-family="Cinzel, serif" font-size="11.5" font-weight="600" fill="#1F3F7A">Papilla</text><text x="138" y="148" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">blood supply</text><text x="138" y="166" text-anchor="middle" font-family="Cinzel, serif" font-size="11.5" font-weight="600" fill="#1F3F7A">Arrector pili</text><text x="138" y="180" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">smooth muscle;</text><text x="138" y="194" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">goosebumps</text><circle cx="862" cy="138" r="112" fill="#EADBB8" stroke="#A8812A" stroke-width="2.5"></circle><circle cx="862" cy="138" r="86" fill="#F3E9D2" stroke="#2B2118" stroke-width="0.9"></circle><text font-family="EB Garamond, Georgia, serif" font-size="14.00" fill="#2B2118"><textPath href="#sc1" startOffset="8.9" textLength="572.9" lengthAdjust="spacing"><tspan fill="#9E2B1A" font-family="Cinzel, serif" font-weight="600">NAILS ✠ </tspan><tspan>scale-like epidermis of hard keratin · pink from the capillaries · </tspan></textPath></text><text x="862" y="102" text-anchor="middle" font-family="Cinzel, serif" font-size="11.5" font-weight="600" fill="#1F3F7A">Matrix</text><text x="862" y="116" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">grows the nail</text><text x="862" y="134" text-anchor="middle" font-family="Cinzel, serif" font-size="11.5" font-weight="600" fill="#1F3F7A">Lunule</text><text x="862" y="148" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">white crescent</text><text x="862" y="166" text-anchor="middle" font-family="Cinzel, serif" font-size="11.5" font-weight="600" fill="#1F3F7A">Eponychium</text><text x="862" y="180" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">the cuticle</text><circle cx="138" cy="862" r="112" fill="#EADBB8" stroke="#A8812A" stroke-width="2.5"></circle><circle cx="138" cy="862" r="86" fill="#F3E9D2" stroke="#2B2118" stroke-width="0.9"></circle><text font-family="EB Garamond, Georgia, serif" font-size="13.85" fill="#2B2118"><textPath href="#sc2" startOffset="8.9" textLength="572.9" lengthAdjust="spacing"><tspan fill="#9E2B1A" font-family="Cinzel, serif" font-weight="600">SKIN CANCER ✠ </tspan><tspan>basal cell most common · squamous cell second · melanoma most dangerous · </tspan></textPath></text><text x="138" y="846" text-anchor="middle" font-family="Cinzel, serif" font-size="11.5" font-weight="600" fill="#1F3F7A">Melanoma ABCDE</text><text x="138" y="860" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">asymmetry, border,</text><text x="138" y="872" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">color, diameter over 6</text><text x="138" y="886" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">mm, evolving</text><circle cx="862" cy="862" r="112" fill="#EADBB8" stroke="#A8812A" stroke-width="2.5"></circle><circle cx="862" cy="862" r="86" fill="#F3E9D2" stroke="#2B2118" stroke-width="0.9"></circle><text font-family="EB Garamond, Georgia, serif" font-size="11.95" fill="#2B2118"><textPath href="#sc3" startOffset="8.9" textLength="572.9" lengthAdjust="spacing"><tspan fill="#9E2B1A" font-family="Cinzel, serif" font-weight="600">BURNS ✠ </tspan><tspan>threat: fluid and electrolyte loss, shock · critical: &gt;25% 2nd, &gt;10% 3rd, face, hands, feet · </tspan></textPath></text><text x="862" y="814" text-anchor="middle" font-family="Cinzel, serif" font-size="11.5" font-weight="600" fill="#1F3F7A">1st degree</text><text x="862" y="828" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">epidermis; red and</text><text x="862" y="840" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">painful</text><text x="862" y="858" text-anchor="middle" font-family="Cinzel, serif" font-size="11.5" font-weight="600" fill="#1F3F7A">2nd degree</text><text x="862" y="872" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">into dermis; blisters</text><text x="862" y="890" text-anchor="middle" font-family="Cinzel, serif" font-size="11.5" font-weight="600" fill="#1F3F7A">3rd degree</text><text x="862" y="904" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">full thickness; nerves</text><text x="862" y="918" text-anchor="middle" font-family="EB Garamond, serif" font-size="11.5" font-style="italic" fill="#2B2118">lost</text><rect x="262" y="22" width="476" height="48" fill="#EADBB8" stroke="#A8812A" stroke-width="2"></rect><text x="500" y="40" text-anchor="middle" font-family="Cinzel, serif" font-size="12" font-weight="600" fill="#9E2B1A">✠ RULE OF NINES ✠</text><text x="500" y="59" text-anchor="middle" font-family="EB Garamond, serif" font-size="13" fill="#2B2118">Head 9 · Each arm 9 · Trunk 36 · Each leg 18 · Perineum 1</text><rect x="262" y="930" width="476" height="48" fill="#EADBB8" stroke="#A8812A" stroke-width="2"></rect><text x="500" y="948" text-anchor="middle" font-family="Cinzel, serif" font-size="12" font-weight="600" fill="#9E2B1A">✠ ON THE SLIDE ✠</text><text x="500" y="967" text-anchor="middle" font-family="EB Garamond, serif" font-size="13" fill="#2B2118">Corneum: no nuclei · Granulosum: dark granules · Basale: one dark row</text></svg>